let idx = 0, answers = {}, rater = "";
function start(){
  rater = document.getElementById('rater').value.trim() || "anonymous";
  document.getElementById('setup').style.display='none';
  document.getElementById('quiz').style.display='block';
  render();
}
function render(){
  const it = ITEMS[idx];
  document.getElementById('n').innerHTML = '<small>'+(idx+1)+' of '+ITEMS.length+'</small>';
  document.getElementById('fill').style.width = (idx/ITEMS.length*100)+'%';
  document.getElementById('prompt').textContent = it.prompt;
  document.getElementById('optA').textContent = it.a;
  document.getElementById('optB').textContent = it.b;
}
function pick(choice){
  answers[ITEMS[idx].id] = choice;
  idx++;
  if(idx >= ITEMS.length){
    document.getElementById('quiz').style.display='none';
    document.getElementById('done').style.display='block';
    document.getElementById('code').value = JSON.stringify({rater: rater, answers: answers});
  } else { render(); }
}
</script></body></html>
